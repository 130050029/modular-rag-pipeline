name: Unit Tests

on:
  push:
    paths:
      - rag_python/**
      - tests/python/unit/**
      - tests/python/conftest.py
      - pytest.ini
  pull_request:
    paths:
      - rag_python/**
      - tests/python/unit/**
      - tests/python/conftest.py
      - pytest.ini

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: rag_python/requirements.txt

      - name: Install dependencies
        run: pip install -r rag_python/requirements.txt

      - name: Run unit tests
        env:
          # KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "1"
        run: pytest -m unit -n auto -v