# Local Postgres, Redis, and Qdrant for development/testing.
# Postgres: config.DB_BACKEND=postgres. Redis: config.NEAR_DUP_BACKEND=redis.
# Qdrant: config.VECTOR_BACKEND=qdrant. None of these are used for the
# default (SQLite + in-memory MinHash + FAISS HNSW) configuration.
#
# Start:  docker compose up -d
# Stop:   docker compose down        (all bind-mounted data dirs survive --
#                                      see data/postgres_data, data/redis_data,
#                                      data/qdrant_data)
# Wipe:   rm -rf data/postgres_data data/redis_data data/qdrant_data

services:
  postgres:
    image: postgres:16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag_dev
      POSTGRES_PASSWORD: rag_dev_password
      POSTGRES_DB: rag_dev
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rag-redis
    ports:
      - "6379:6379"
    # Bind-mounted, matching the Postgres pattern above -- without this,
    # Redis's own RDB snapshotting still runs, but the snapshot files land
    # inside the container's ephemeral filesystem and are lost on container
    # removal, defeating the entire reason to choose the Redis backend
    # (persistence across restarts) in the first place. The --save/
    # --appendonly flags make snapshotting explicit rather than relying on
    # the image's undocumented default behavior.
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - ./data/redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - ./data/qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama_data:/root/.ollama