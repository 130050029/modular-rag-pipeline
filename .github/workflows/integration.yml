name: Integration Tests

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag_dev
          POSTGRES_PASSWORD: rag_dev_password
          POSTGRES_DB: rag_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_dev -d rag_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r rag_python/requirements.txt

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && break
            sleep 2
          done

      - name: Run integration tests
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "1"

          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: rag_dev
          POSTGRES_USER: rag_dev
          POSTGRES_PASSWORD: rag_dev_password

          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15

          QDRANT_HOST: 127.0.0.1
          QDRANT_PORT: 6333
          QDRANT_COLLECTION: rag_chunks_test

        run: pytest tests/python/integration/ -v