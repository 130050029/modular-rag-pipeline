# Local Postgres and Redis for development/testing.
# Postgres: config.DB_BACKEND=postgres. Redis: config.NEAR_DUP_BACKEND=redis.
# Neither is used for the default (SQLite + in-memory MinHash) configuration.
#
# Start:  docker compose up -d
# Stop:   docker compose down        (both bind-mounted data dirs survive --
#                                      see data/postgres_data and data/redis_data)
# Wipe:   rm -rf data/postgres_data data/redis_data

services:
  postgres:
    image: postgres:16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag_dev
      POSTGRES_PASSWORD: rag_dev_password
      POSTGRES_DB: rag_dev
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rag-redis
    ports:
      - "6379:6379"
    # Bind-mounted, matching the Postgres pattern above -- without this,
    # Redis's own RDB snapshotting still runs, but the snapshot files land
    # inside the container's ephemeral filesystem and are lost on container
    # removal, defeating the entire reason to choose the Redis backend
    # (persistence across restarts) in the first place. The --save/
    # --appendonly flags make snapshotting explicit rather than relying on
    # the image's undocumented default behavior.
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - ./data/redis_data:/data