[pytest]
# Docling's own internal code triggers a couple of DeprecationWarnings on
# import/use (deprecated fields it references internally) -- these are not
# caused by anything in our code, so scope the suppression specifically to
# warnings originating from the docling package rather than ignoring
# DeprecationWarning project-wide, which would hide genuinely useful
# warnings from our own code or other dependencies.
filterwarnings =
    ignore::DeprecationWarning:docling